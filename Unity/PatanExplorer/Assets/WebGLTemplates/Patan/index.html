<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #150c09; }
    body { color: #f4e6d2; }
    #unity-container { position: fixed; inset: 0; background: radial-gradient(circle at 50% 28%, #6d3522 0%, #311712 36%, #150c09 78%); }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #150c09; outline: none; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, rgba(116, 61, 36, 0.96), rgba(21, 12, 9, 0.99) 70%); transition: opacity 360ms ease; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .loading-card { width: min(460px, calc(100vw - 48px)); text-align: center; }
    .eyebrow { margin: 0 0 14px; color: #d1a46f; font-size: 12px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(42px, 8vw, 76px); font-weight: 400; letter-spacing: -0.045em; }
    .subtitle { margin: 12px 0 30px; color: #d4c0a7; font-size: 15px; }
    .track { width: 100%; height: 3px; overflow: hidden; background: rgba(255, 255, 255, 0.14); }
    #progress { width: 0; height: 100%; background: #e6b574; transition: width 120ms linear; }
    #status { margin-top: 13px; color: #cdbba6; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
    #controls { position: absolute; left: 24px; bottom: 20px; color: rgba(244, 230, 210, 0.72); font-size: 12px; letter-spacing: 0.04em; pointer-events: none; }
    #fullscreen { position: absolute; right: 20px; bottom: 18px; border: 1px solid rgba(244, 230, 210, 0.35); border-radius: 2px; padding: 9px 13px; color: #f4e6d2; background: rgba(21, 12, 9, 0.56); font: inherit; font-size: 12px; cursor: pointer; }
    #fullscreen:hover { border-color: #e6b574; }
    #error { position: absolute; left: 50%; bottom: 72px; width: min(620px, calc(100vw - 48px)); transform: translateX(-50%); padding: 12px 16px; display: none; color: #fff1df; background: rgba(120, 32, 20, 0.94); font-size: 13px; text-align: center; }
    #device-warning { position: absolute; top: 16px; left: 50%; display: none; transform: translateX(-50%); padding: 10px 14px; color: #2b160e; background: #e6b574; font-size: 12px; font-weight: 700; text-align: center; }
  </style>
</head>
<body>
  <main id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <section id="loading" aria-live="polite">
      <div class="loading-card">
        <p class="eyebrow">Lalitpur, Nepal</p>
        <h1>Loading Patan</h1>
        <p class="subtitle">Preparing the Krishna Mandir greybox milestone</p>
        <div class="track"><div id="progress"></div></div>
        <div id="status">Starting 0%</div>
      </div>
    </section>
    <div id="controls">WASD · MOVE &nbsp;&nbsp; MOUSE · LOOK &nbsp;&nbsp; SHIFT · RUN &nbsp;&nbsp; SPACE · JUMP &nbsp;&nbsp; ESC · RELEASE</div>
    <button id="fullscreen" type="button">Fullscreen</button>
    <div id="error" role="alert"></div>
    <div id="device-warning">Desktop keyboard and mouse are required for this milestone.</div>
  </main>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#loading");
    const progress = document.querySelector("#progress");
    const status = document.querySelector("#status");
    const error = document.querySelector("#error");
    const controls = document.querySelector("#controls");
    const fullscreen = document.querySelector("#fullscreen");
    const deviceWarning = document.querySelector("#device-warning");
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    const config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
    };

    if (window.matchMedia("(pointer: coarse)").matches) {
      deviceWarning.style.display = "block";
    }

    const showError = (message) => {
      error.textContent = message;
      error.style.display = "block";
      status.textContent = "Unable to load";
    };

    const loader = document.createElement("script");
    loader.src = loaderUrl;
    loader.onload = () => {
      createUnityInstance(canvas, config, (value) => {
        const percentage = Math.round(value * 100);
        progress.style.width = percentage + "%";
        status.textContent = "Loading " + percentage + "%";
      }).then((instance) => {
        loading.classList.add("hidden");
        controls.style.display = "none";
        canvas.focus();
        fullscreen.addEventListener("click", () => instance.SetFullscreen(1));
      }).catch((message) => showError(String(message)));
    };
    loader.onerror = () => showError("The Unity loader could not be downloaded. Check the connection and reload.");
    document.body.appendChild(loader);
  </script>
</body>
</html>
